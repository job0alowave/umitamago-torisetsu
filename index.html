<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うみたまごのトリセツ診断｜生年月日でわかる、お子さんの海タイプ</title>
<style>
  :root {
    --ocean-deep: #0d4f6e;
    --ocean-mid: #1a7fa3;
    --ocean-light: #6ec3d9;
    --ocean-foam: #eaf7fa;
    --accent: #ff9f7a;
    --text-dark: #1a2e35;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, var(--ocean-deep) 0%, var(--ocean-mid) 40%, var(--ocean-light) 100%);
    min-height: 100vh;
    color: var(--text-dark);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { text-align: center; color: #fff; margin-bottom: 24px; }
  header .emoji { font-size: 48px; }
  header h1 { font-size: 20px; margin-top: 8px; line-height: 1.5; }
  header p { font-size: 13px; opacity: 0.9; margin-top: 6px; }

  .card {
    background: var(--ocean-foam);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  .card + .card { margin-top: 16px; }

  label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--ocean-deep); }
  input[type="date"] {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 2px solid var(--ocean-light);
    border-radius: 12px;
    background: #fff;
  }
  button {
    width: 100%;
    padding: 16px;
    margin-top: 16px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  button:active { transform: scale(0.98); }

  #result { display: none; }
  .result-emoji { font-size: 64px; text-align: center; }
  .result-name { text-align: center; font-size: 22px; font-weight: bold; color: var(--ocean-deep); margin: 8px 0 4px; }
  .result-sub { text-align: center; font-size: 13px; color: #567; margin-bottom: 16px; }
  .result-desc { font-size: 15px; line-height: 1.8; }
  .result-desc b { color: var(--ocean-mid); }

  .cta-box {
    margin-top: 20px;
    padding: 18px;
    background: #fff;
    border: 2px dashed var(--accent);
    border-radius: 14px;
    text-align: center;
  }
  .cta-box p { font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
  .cta-box .code {
    display: inline-block;
    background: var(--ocean-foam);
    border: 1px solid var(--ocean-light);
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: bold;
    font-size: 16px;
    color: var(--ocean-deep);
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .line-btn {
    display: block;
    background: #06C755;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
  }

  .disclaimer {
    margin-top: 24px;
    font-size: 11px;
    color: #fff;
    opacity: 0.85;
    line-height: 1.6;
    text-align: center;
  }
  .retry { text-align: center; margin-top: 14px; }
  .retry a { color: var(--ocean-mid); font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="emoji">🐚</div>
    <h1>うみたまごのトリセツ診断</h1>
    <p>生年月日を入れるだけ。お子さんの「海タイプ」がわかります</p>
  </header>

  <div class="card" id="form-card">
    <label for="birthdate">お子さんの生年月日</label>
    <input type="date" id="birthdate" min="2005-01-01" max="2026-12-31">
    <button onclick="diagnose()">診断する</button>
  </div>

  <div class="card" id="result">
    <div class="result-emoji" id="r-emoji"></div>
    <div class="result-name" id="r-name"></div>
    <div class="result-sub">表面タイプ（周りから見える印象）</div>
    <div class="result-desc" id="r-desc"></div>

    <div class="cta-box">
      <p>この結果をもとにした<br><b>NGワード・効くアプローチ・褒めどころ</b>を、公式LINEで無料でお届けしています。</p>
      <div class="code" id="r-code"></div>
      <p style="font-size:12px; color:#789;">↑ この番号を、LINEのトーク画面にそのまま送ってください</p>
      <a class="line-btn" href="#" id="line-link" target="_blank">公式LINEを追加して結果を受け取る</a>
    </div>

    <div class="retry"><a href="#" onclick="reset(); return false;">もう一度診断する</a></div>
  </div>

  <p class="disclaimer">
    ※ 本診断は医学的な診断ではありません。お子さんの性格傾向を知るための自己理解ツールです。<br>
    発達面で気になることがある場合は、医療機関・専門機関にご相談ください。
  </p>

</div>

<script>
// うみたまご気質診断ロジック
// 生年月日8桁の各桁を合計→8で割った余り+1（余り0なら8番目）
const TYPES = [
  { emoji: "🐬", name: "イルカ", desc: "明るく好奇心旺盛で、みんなの人気者。新しいことにもすぐ飛びつくタイプです。" },
  { emoji: "🦈", name: "サメ", desc: "一点集中型。好きなことへのこだわりが強く、興味のあることには驚くほど深く没頭します。" },
  { emoji: "🐋", name: "クジラ", desc: "おおらかで包容力があり、マイペース。周りのペースに巻き込まれにくいタイプです。" },
  { emoji: "🦦", name: "ラッコ", desc: "のんびり屋で癒し系。争いを好まず、穏やかな空気を作るのが得意です。" },
  { emoji: "🐢", name: "カメ", desc: "慎重派で、じっくりコツコツ型。時間はかかっても、着実に物事を進めます。" },
  { emoji: "🎐", name: "クラゲ", desc: "繊細で感受性豊か。周りの雰囲気やちょっとした変化に敏感に反応します。" },
  { emoji: "🐙", name: "タコ", desc: "賢くて工夫好き。一人の時間も大切にする、マイペースな探求者です。" },
  { emoji: "🐚", name: "ヤドカリ", desc: "人見知りで慣れるまで時間がかかりますが、一度懐くととても深い関係を築きます。" }
];

function calcType(dateStr) {
  const digits = dateStr.replace(/-/g, "").split("").map(Number);
  const sum = digits.reduce((a, b) => a + b, 0);
  const remainder = sum % 8;
  return remainder === 0 ? 8 : remainder + 1;
}

function diagnose() {
  const val = document.getElementById("birthdate").value;
  if (!val) {
    alert("生年月日を入力してください");
    return;
  }
  const typeNum = calcType(val); // 1-8
  const t = TYPES[typeNum - 1];

  document.getElementById("r-emoji").textContent = t.emoji;
  document.getElementById("r-name").textContent = t.name + "タイプ";
  document.getElementById("r-desc").innerHTML = t.desc;
  document.getElementById("r-code").textContent = "うみ" + typeNum + "ばん";

  document.getElementById("line-link").href = "https://lin.ee/W1jX4L3";

  document.getElementById("form-card").style.display = "none";
  document.getElementById("result").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function reset() {
  document.getElementById("form-card").style.display = "block";
  document.getElementById("result").style.display = "none";
  document.getElementById("birthdate").value = "";
}
</script>
</body>
</html>
